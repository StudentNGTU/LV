<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Video</title>
    <style>
        @keyframes bgShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0a1930, #1e143a, #2a0040);
            background-size: 200% 200%;
            animation: bgShift 20s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
            position: relative;
            overflow: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            border-radius: 30px;
            padding: 25px;
            width: 100%;
            max-width: 430px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        video {
            width: 100%;
            height: auto;
            border-radius: 24px;
            background-color: #000;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 204, 255, 0.2);
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid #00ccff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <video id="zootopiaClip" playsinline muted autoplay controls>
            <source src="ZP2.mp4" type="video/mp4">
        </video>

        <div class="loader" id="loader"></div>
    </div>

    <script>
        const video = document.getElementById('zootopiaClip');
        const loader = document.getElementById('loader');

        /* Показываем индикатор загрузки, пока видео буферизуется */
        video.addEventListener('waiting', () => {
            loader.style.display = 'block';
        });
        video.addEventListener('canplay', () => {
            loader.style.display = 'none';
        });
        video.addEventListener('error', () => {
            loader.style.display = 'none';
            alert('Ошибка загрузки видео. Проверьте, что файл clip.mp4 лежит в той же папке.');
        });
    </script>

</body>
</html>
