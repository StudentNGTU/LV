<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Отрывок из Зверополиса</title>
    <style>
        /* Современный сброс стилей для iOS */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Настройки для экрана iPhone 15 Pro (Dynamic Island и скругления) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000; /* Черный фон, чтобы видео сливалось с экраном */
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            /* Безопасные зоны для iPhone 15 Pro (учитывают Dynamic Island и скругленные углы) */
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Главный блок видео */
        video {
            width: 100%;
            max-width: 430px; /* Максимальная ширина экрана iPhone 15 Pro */
            height: auto;
            border-radius: 20px; /* Скругление углов видео, чтобы повторить дизайн iOS */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            background-color: #000;
            display: block;
        }

        /* Текст-подсказка под видео */
        .caption {
            margin-top: 20px;
            font-size: 16px;
            line-height: 1.4;
            text-align: center;
            color: #E5E5EA;
            padding: 0 20px;
        }

        /* Кнопка воспроизведения (на случай, если видео не заиграло само) */
        .play-btn {
            margin-top: 30px;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background-color: #007AFF; /* Классический синий цвет iOS */
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .play-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>
            <!-- 
                ВАЖНО: 
                1. Замените "clip.mp4" на точное имя вашего скачанного файла.
                2. Атрибут autoplay включит видео сразу при открытии.
                3. Атрибут playsinline обязателен для iPhone, иначе видео попытается открыться на весь экран.
                4. muted обязателен для автовоспроизведения в мобильных браузерах.
            -->
            <video id="zootopiaClip" autoplay playsinline muted controls>
                <source src="ZP2.mp4" type="video/mp4">
            </video>
            
            <div class="caption">
                Эпизод из мультфильма «Зверополис» (1:23:10)
            </div>

            <!-- Скрытая кнопка, которая появится, если браузер заблокирует автовоспроизведение -->
            <button class="play-btn" id="playFallback" style="display: none;">
                ▶️ Воспроизвести
            </button>
        </div>
    </div>

    <script>
        // iOS Safari очень строго относится к автовоспроизведению со звуком.
        // Этот скрипт подстрахует нас: если видео не смогло запуститься само,
        // он покажет пользователю понятную кнопку.
        const video = document.getElementById('zootopiaClip');
        const playBtn = document.getElementById('playFallback');

        // Проверяем, смогло ли видео запуститься автоматически через 1 секунду
        setTimeout(() => {
            if (video.paused) {
                playBtn.style.display = 'block';
            }
        }, 1000);

        playBtn.addEventListener('click', function() {
            // При нажатии убираем заглушку звука, чтобы был звук
            video.muted = false;
            video.play();
            playBtn.style.display = 'none';
        });
    </script>

</body>
</html>
